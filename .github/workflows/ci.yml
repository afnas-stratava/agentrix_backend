name: CI/CD

"on":
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "ECR image tag to deploy (default: dev-latest)"
        required: false
        default: "dev-latest"

env:
  AWS_REGION: us-west-2
  ECR_REPOSITORY: agentrix/backend

jobs:
  build:
    name: Build and push to ECR
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Delete existing image in ECR (if exists)
        run: |
          aws ecr batch-delete-image --repository-name ${{ env.ECR_REPOSITORY }} --image-ids imageTag=dev-latest --region ${{ env.AWS_REGION }} || true
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          aws ecr batch-delete-image --repository-name ${{ env.ECR_REPOSITORY }} --image-ids imageTag=dev-$SHORT_SHA --region ${{ env.AWS_REGION }} || true
          echo "Existing tags cleared (if any)"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}
          tags: |
            type=raw,value=dev-latest
            type=sha,format=short,prefix=dev-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name != 'pull_request'
    environment: dev
    permissions:
      contents: read
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            IMAGE_TAG="${{ inputs.image_tag }}"
            if [ -z "$IMAGE_TAG" ]; then IMAGE_TAG="dev-latest"; fi
            IMAGE="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG"
            echo "Deploying $IMAGE..."
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
            docker network create agentrix-be 2>/dev/null || true
            echo "Removing old container/image if exists..."
            docker stop agentrix-backend || true
            docker rm agentrix-backend || true
            docker rmi "$IMAGE" || true
            echo "Pulling $IMAGE..."
            docker pull "$IMAGE"
            docker run -d --name agentrix-backend --network agentrix-be --restart unless-stopped -p 127.0.0.1:8000:8000 \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e GOOGLE_SERVER_CLIENT_ID="${{ secrets.GOOGLE_SERVER_CLIENT_ID }}" \
              -e HUME_API_KEY="${{ secrets.HUME_API_KEY }}" \
              -e HUME_SECRET_KEY="${{ secrets.HUME_SECRET_KEY }}" \
              -e HUME_CONFIG_ID="${{ secrets.HUME_CONFIG_ID }}" \
              "$IMAGE"
            docker ps | grep agentrix-backend
            curl -sf http://localhost:80/health || curl -sf http://localhost:8000/health || echo "health check pending"
